name: Issue 29 Refresh Dependency Lock

on:
  push:
    branches:
      - ci/issue-29-workflow-hardening
    paths:
      - .github/workflows/issue-29-refresh-lock.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Regenerate and verify hash lock
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet pip-tools
          python -m piptools compile \
            --generate-hashes \
            --resolver=backtracking \
            --output-file tools/validate-schemas/requirements.lock \
            tools/validate-schemas/requirements.txt
          python -m pip install \
            --disable-pip-version-check \
            --require-hashes \
            -r tools/validate-schemas/requirements.lock

      - name: Commit refreshed lock to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/validate-schemas/requirements.lock
          if git diff --cached --quiet; then
            echo 'Lock is already current.'
            exit 0
          fi
          git commit -m 'build: refresh hash-locked validation dependencies'
          git push origin HEAD:ci/issue-29-workflow-hardening
