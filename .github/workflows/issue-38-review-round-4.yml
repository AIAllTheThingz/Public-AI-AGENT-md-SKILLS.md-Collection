name: Issue 38 Review Round 4

on:
  push:
    branches:
      - maintenance/issue-38-release-state-consistency
    paths:
      - .github/workflows/issue-38-review-round-4.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out target branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: maintenance/issue-38-release-state-consistency
          fetch-depth: 0

      - name: Apply review fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/release/validate_release.py')
          text = path.read_text(encoding='utf-8')
          anchor = '''    if not isinstance(next_intended, str) or not SEMVER.fullmatch(next_intended):\n        findings.append(Finding(\n            "RELEASE_STATE_INVALID",\n            "nextIntendedVersion must be a Semantic Version 2.0.0 string.",\n            path=RELEASE_STATE_PATH.as_posix(),\n            details={"value": next_intended},\n        ))\n        return {}\n    return state\n'''
          replacement = '''    if not isinstance(next_intended, str) or not SEMVER.fullmatch(next_intended):\n        findings.append(Finding(\n            "RELEASE_STATE_INVALID",\n            "nextIntendedVersion must be a Semantic Version 2.0.0 string.",\n            path=RELEASE_STATE_PATH.as_posix(),\n            details={"value": next_intended},\n        ))\n        return {}\n    if next_intended in blocked:\n        findings.append(Finding(\n            "RELEASE_STATE_INVALID",\n            "nextIntendedVersion must not also appear in preparedUnpublishedVersions.",\n            path=RELEASE_STATE_PATH.as_posix(),\n            details={"value": next_intended},\n        ))\n        return {}\n    return state\n'''
          if anchor not in text:
              raise SystemExit('release-state cross-field anchor not found')
          path.write_text(text.replace(anchor, replacement, 1), encoding='utf-8')

          path = Path('tools/tests/test_release.py')
          text = path.read_text(encoding='utf-8')
          test_anchor = '    def test_valid_semver_prerelease_release_state_passes(self):\n'
          test_block = '''    def test_release_state_rejects_blocked_next_intended_version(self):\n        with tempfile.TemporaryDirectory() as temp:\n            root = Path(temp)\n            make_release_root(root, "1.0.0")\n            (root / "releases" / "release-state.json").write_text(\n                json.dumps({\n                    "preparedUnpublishedVersions": ["1.0.0"],\n                    "nextIntendedVersion": "1.0.0",\n                }) + "\\n",\n                encoding="utf-8",\n            )\n            completed = run_tool("tools/release/validate_release.py", "--format", "json", root=root)\n            self.assertEqual(completed.returncode, 1, completed.stdout + completed.stderr)\n            findings = json_result(completed)["findings"]\n            self.assertTrue(\n                any(\n                    item["code"] == "RELEASE_STATE_INVALID"\n                    and "must not also appear" in item["message"]\n                    for item in findings\n                ),\n                findings,\n            )\n\n'''
          if 'test_release_state_rejects_blocked_next_intended_version' not in text:
              if test_anchor not in text:
                  raise SystemExit('release test insertion anchor not found')
              text = text.replace(test_anchor, test_block + test_anchor, 1)

          invalid_anchor = '''        invalid_states = (\n            {"preparedUnpublishedVersions": [], "nextIntendedVersion": "1.2.3-01"},\n            {"preparedUnpublishedVersions": [], "nextIntendedVersion": "1٢.2.3"},\n            {"preparedUnpublishedVersions": []},\n        )\n'''
          invalid_replacement = '''        invalid_states = (\n            {"preparedUnpublishedVersions": [], "nextIntendedVersion": "1.2.3-01"},\n            {"preparedUnpublishedVersions": [], "nextIntendedVersion": "1٢.2.3"},\n            {"preparedUnpublishedVersions": []},\n            {"preparedUnpublishedVersions": ["1.0.0"], "nextIntendedVersion": "1.0.0"},\n        )\n'''
          if invalid_anchor not in text:
              raise SystemExit('builder invalid-state tuple not found')
          text = text.replace(invalid_anchor, invalid_replacement, 1)
          path.write_text(text, encoding='utf-8')

          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          old = 'Next intended release: **0.10.0**'
          new = 'Next intended publication: `0.10.0`.'
          if old not in text:
              raise SystemExit('root README release-direction sentence not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          path = Path('releases/README.md')
          text = path.read_text(encoding='utf-8')
          old = 'The next publication is intended to be forward-only as `0.10.0`. Before that tag is created, `VERSION`, changelog, release notes, migration guidance, release artifacts, and validation evidence must all describe `0.10.0` consistently.'
          new = 'The next intended publication is `0.10.0` and is forward-only. Before that tag is created, `VERSION`, changelog, release notes, migration guidance, release artifacts, and validation evidence must all describe `0.10.0` consistently.'
          if old not in text:
              raise SystemExit('release index direction sentence not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          path = Path('tools/tests/test_repository_identity.py')
          text = path.read_text(encoding='utf-8')
          old = '''NEXT_PUBLICATION = re.compile(\n    rf"next intended publication(?:\\s+is|:)?\\s+`(?P<version>{SEMVER})`",\n    re.IGNORECASE,\n)\n'''
          new = '''NEXT_PUBLICATION = re.compile(\n    rf"(?:(?:next intended|intended next) publication)(?:\\s+is|:)?\\s+(?:the\\s+forward-only\\s+)?`(?P<version>{SEMVER})`",\n    re.IGNORECASE,\n)\n'''
          if old not in text:
              raise SystemExit('NEXT_PUBLICATION regex block not found')
          text = text.replace(old, new, 1)

          old = '''        roadmap = (REPO_ROOT / "ROADMAP.md").read_text(encoding="utf-8")\n        manifest = (REPO_ROOT / "MANIFEST.md").read_text(encoding="utf-8")\n        catalog = (REPO_ROOT / "CATALOG.md").read_text(encoding="utf-8")\n        release_policy = (REPO_ROOT / "RELEASE_POLICY.md").read_text(encoding="utf-8")\n\n        expected_direction = {\n            "ROADMAP.md": (\n                f"- The next intended publication is `{next_version}` after source-currency review, "\n                "final release preparation, and the independent specialist review required for its breaking changes."\n            ),\n            "MANIFEST.md": f"Next intended publication: `{next_version}`.",\n            "CATALOG.md": f"The next intended publication is `{next_version}`.",\n            "RELEASE_POLICY.md": f"The forward-only next intended publication is `{next_version}`, as recorded in",\n        }\n        durable_docs = {\n            "ROADMAP.md": roadmap,\n            "MANIFEST.md": manifest,\n            "CATALOG.md": catalog,\n            "RELEASE_POLICY.md": release_policy,\n        }\n'''
          new = '''        durable_docs = {\n            "README.md": (REPO_ROOT / "README.md").read_text(encoding="utf-8"),\n            "ROADMAP.md": (REPO_ROOT / "ROADMAP.md").read_text(encoding="utf-8"),\n            "MANIFEST.md": (REPO_ROOT / "MANIFEST.md").read_text(encoding="utf-8"),\n            "CATALOG.md": (REPO_ROOT / "CATALOG.md").read_text(encoding="utf-8"),\n            "RELEASE_POLICY.md": (REPO_ROOT / "RELEASE_POLICY.md").read_text(encoding="utf-8"),\n            "releases/README.md": (REPO_ROOT / "releases" / "README.md").read_text(encoding="utf-8"),\n            "tools/release/README.md": (REPO_ROOT / "tools" / "release" / "README.md").read_text(encoding="utf-8"),\n        }\n        roadmap = durable_docs["ROADMAP.md"]\n        manifest = durable_docs["MANIFEST.md"]\n        catalog = durable_docs["CATALOG.md"]\n        release_policy = durable_docs["RELEASE_POLICY.md"]\n\n        expected_direction = {\n            "README.md": f"Next intended publication: `{next_version}`.",\n            "ROADMAP.md": (\n                f"- The next intended publication is `{next_version}` after source-currency review, "\n                "final release preparation, and the independent specialist review required for its breaking changes."\n            ),\n            "MANIFEST.md": f"Next intended publication: `{next_version}`.",\n            "CATALOG.md": f"The next intended publication is `{next_version}`.",\n            "RELEASE_POLICY.md": f"The forward-only next intended publication is `{next_version}`, as recorded in",\n            "releases/README.md": f"The next intended publication is `{next_version}` and is forward-only.",\n            "tools/release/README.md": f"The next intended publication is `{next_version}` after the repository `VERSION`",\n        }\n'''
          if old not in text:
              raise SystemExit('durable docs block not found')
          text = text.replace(old, new, 1)

          insertion_anchor = '        self.assertIn("prepared, unpublished", manifest.lower())\n'
          insertion = '''        discovered_declarations = {}\n        for candidate in REPO_ROOT.rglob("*.md"):\n            if ".git" in candidate.parts:\n                continue\n            candidate_text = candidate.read_text(encoding="utf-8")\n            versions = NEXT_PUBLICATION.findall(candidate_text)\n            if versions:\n                relative = candidate.relative_to(REPO_ROOT).as_posix()\n                discovered_declarations[relative] = versions\n                with self.subTest(discovered_document=relative):\n                    self.assertTrue(\n                        all(version == next_version for version in versions),\n                        f"{relative} contains stale next-publication declarations: {versions!r}; expected {next_version!r}.",\n                    )\n\n        self.assertTrue(set(durable_docs).issubset(discovered_declarations))\n\n'''
          if insertion not in text:
              if insertion_anchor not in text:
                  raise SystemExit('dynamic discovery insertion anchor not found')
              text = text.replace(insertion_anchor, insertion + insertion_anchor, 1)
          path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          python -m pip install --disable-pip-version-check --quiet --require-hashes -r tools/validate-schemas/requirements.lock
          python -m unittest discover -s tools/tests -p 'test_release.py' -v
          python -m unittest discover -s tools/tests -p 'test_repository_identity.py' -v

      - name: Commit fixes and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AIAllTheThingz'
          git config user.email 'aiallthethingz@gmail.com'
          git rm .github/workflows/issue-38-review-round-4.yml
          git add README.md releases/README.md tools/release/validate_release.py tools/tests/test_release.py tools/tests/test_repository_identity.py
          git commit -m 'fix: close release-state direction gaps'
          git push origin HEAD:maintenance/issue-38-release-state-consistency
