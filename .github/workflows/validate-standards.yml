name: Validate standards

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-standards-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact repository head
        shell: bash
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${HEAD_REPO}.git"
          git -c protocol.version=2 fetch --no-tags --depth=1 origin "$HEAD_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"

      - name: Select cached Python 3.13
        shell: bash
        run: |
          set -euo pipefail
          python_root="$(find /opt/hostedtoolcache/Python -mindepth 1 -maxdepth 1 -type d -name '3.13.*' | sort -V | tail -n 1)"
          test -n "$python_root"
          python_bin="$python_root/x64/bin/python"
          test -x "$python_bin"
          echo "$python_root/x64/bin" >> "$GITHUB_PATH"
          "$python_bin" --version

      - name: Install validation dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --quiet \
            --require-hashes \
            -r tools/validate-schemas/requirements.lock

      - name: Run complete validation pipeline
        shell: bash
        run: |
          result_file="$(mktemp)"
          set +e
          python tools/validate-all/run_all.py --include-tests --format json >"$result_file"
          status=$?
          set -e
          cat "$result_file"
          if [ "$status" -ne 0 ]; then
            python -c 'import json,sys; p=json.load(open(sys.argv[1], encoding="utf-8")); t=(p.get("metadata") or {}).get("tests") or {}; d=(t.get("stderr") or t.get("stdout") or json.dumps(p.get("findings", p), sort_keys=True))[-3500:]; d=d.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"); print("::error title=Validation diagnostics::" + d)' "$result_file"
            exit "$status"
          fi

      - name: Validate distributed source archive
        shell: bash
        run: |
          archive_root="$(mktemp -d)"
          archive_result="$(mktemp)"
          git archive --format=tar HEAD | tar -xf - -C "$archive_root"
          set +e
          python "$archive_root/tools/validate-all/run_all.py" --include-tests --format json >"$archive_result"
          status=$?
          set -e
          cat "$archive_result"
          if [ -e "$archive_root/.git" ]; then
            echo "::error title=Archive validation side effect::Validation left Git metadata inside the extracted source root."
            exit 1
          fi
          cache_artifact="$(find "$archive_root" \( -type d -name '__pycache__' -o -type f \( -name '*.pyc' -o -name '*.pyo' \) \) -print -quit)"
          if [ -n "$cache_artifact" ]; then
            echo "::error title=Archive validation side effect::Validation left Python cache or bytecode inside the extracted source root: $cache_artifact"
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            python -c 'import json,sys; p=json.load(open(sys.argv[1], encoding="utf-8")); t=(p.get("metadata") or {}).get("tests") or {}; d=(t.get("stderr") or t.get("stdout") or json.dumps(p.get("findings", p), sort_keys=True))[-3500:]; d=d.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"); print("::error title=Archive validation diagnostics::" + d)' "$archive_result"
            exit "$status"
          fi
