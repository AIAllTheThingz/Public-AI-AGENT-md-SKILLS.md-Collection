name: Validate standards

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-standards-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/validate-schemas/requirements.lock

      - name: Install validation dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --quiet \
            --require-hashes \
            -r tools/validate-schemas/requirements.lock

      - name: Run complete validation pipeline
        shell: bash
        run: |
          result_file="$(mktemp)"
          set +e
          python tools/validate-all/run_all.py --include-tests --format json >"$result_file"
          status=$?
          set -e
          cat "$result_file"
          if [ "$status" -ne 0 ]; then
            python -c 'import json,sys; p=json.load(open(sys.argv[1], encoding="utf-8")); t=(p.get("metadata") or {}).get("tests") or {}; d=(t.get("stderr") or t.get("stdout") or json.dumps(p.get("findings", p), sort_keys=True))[-3500:]; d=d.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"); print("::error title=Validation diagnostics::" + d)' "$result_file"
            exit "$status"
          fi

      - name: Validate distributed source archive
        shell: bash
        run: |
          archive_root="$(mktemp -d)"
          archive_result="$(mktemp)"
          git archive --format=tar HEAD | tar -xf - -C "$archive_root"
          set +e
          python "$archive_root/tools/validate-all/run_all.py" --include-tests --format json >"$archive_result"
          status=$?
          set -e
          cat "$archive_result"
          if [ -e "$archive_root/.git" ]; then
            echo "::error title=Archive validation side effect::Validation left Git metadata inside the extracted source root."
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            python -c 'import json,sys; p=json.load(open(sys.argv[1], encoding="utf-8")); t=(p.get("metadata") or {}).get("tests") or {}; d=(t.get("stderr") or t.get("stdout") or json.dumps(p.get("findings", p), sort_keys=True))[-3500:]; d=d.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"); print("::error title=Archive validation diagnostics::" + d)' "$archive_result"
            exit "$status"
          fi
