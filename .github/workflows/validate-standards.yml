name: Validate standards

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-standards-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/validate-schemas/requirements.lock

      - name: Install validation dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --quiet \
            --require-hashes \
            -r tools/validate-schemas/requirements.lock

      - name: Debug unit tests verbosely
        if: github.event_name == 'pull_request'
        shell: bash
        run: python -m unittest discover -s tools/tests -p "test_*.py" -v

      - name: Run complete validation pipeline
        shell: bash
        run: python tools/validate-all/run_all.py --include-tests
