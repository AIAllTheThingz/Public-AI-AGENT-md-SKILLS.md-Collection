name: Issue 28 Review Follow-up

on:
  push:
    branches:
      - policy/issue-28-lightweight-maintenance
    paths:
      - .github/workflows/issue-28-review-followup.yml

permissions:
  contents: write

jobs:
  correct-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out policy branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Apply exact policy corrections
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              "MAINTAINERS.md": [
                  (
                      "The lightweight model narrows mandatory independent review to decisions where an independent party materially changes the risk boundary: high or critical changes, breaking published compatibility commitments, final `1.0.0` approval, and stable-maturity commitments.",
                      "The lightweight model narrows mandatory independent review to decisions where an independent party materially changes the risk boundary: high or critical changes, any breaking repository change as defined by `RELEASE_POLICY.md`, final `1.0.0` approval, and stable-maturity commitments."
                  ),
                  (
                      "- high/critical risk and published/stable compatibility commitments still require independent review",
                      "- high/critical risk, breaking repository changes, and stable compatibility commitments still require independent review"
                  ),
                  (
                      "- breaking repository releases or changes that remove or invalidate a published stable compatibility commitment",
                      "- any change classified as breaking under `RELEASE_POLICY.md`, including pre-1.0 breaking changes"
                  ),
                  (
                      "Routine low- or moderate-risk governance, security-hardening, schema, executable-tool, dependency, workflow, or release-automation changes do **not** automatically require an external reviewer. They still require documented impact, permanent CI, and maintainer review.",
                      "Routine low- or moderate-risk governance, security-hardening, schema, executable-tool, dependency, workflow, or release-automation changes that are not classified as breaking do **not** automatically require an external reviewer. They still require documented impact, permanent CI, and maintainer review."
                  ),
                  (
                      "This may include routine normative, security-hardening, schema, executable-tool, dependency, CI, or release-automation maintenance when it remains low or moderate risk and does not alter a stable compatibility commitment.",
                      "This may include routine normative, security-hardening, schema, executable-tool, dependency, CI, or release-automation maintenance when it remains low or moderate risk, is not classified as breaking under `RELEASE_POLICY.md`, and does not alter a stable compatibility commitment."
                  ),
                  (
                      "Self-merge is prohibited when independent specialist review is required by this policy, including high/critical risk, a breaking repository release, the final `1.0.0` compatibility approval, or promotion to `stable`, unless the emergency-change process applies.",
                      "Self-merge is prohibited when independent specialist review is required by this policy, including high/critical risk, any breaking repository change, the final `1.0.0` compatibility approval, or promotion to `stable`, unless the emergency-change process applies."
                  ),
                  (
                      "- obtain independent specialist review if the emergency change would normally trigger an independent-review gate; otherwise seek specialist review when it would materially improve confidence",
                      "- complete and record a retrospective review of the emergency change, authorization, evidence, and incident or change record\n- when the emergency change triggers an independent-review gate, the retrospective review must include qualified independent specialist review; otherwise an active maintainer may perform the retrospective review and should seek specialist input when it would materially improve confidence"
                  ),
              ],
              "CONTRIBUTING.md": [
                  (
                      "including high/critical changes, breaking repository releases, the final `1.0.0` compatibility approval, and stable-maturity commitments.",
                      "including high/critical changes, any breaking repository change, the final `1.0.0` compatibility approval, and stable-maturity commitments."
                  ),
              ],
              "RELEASE_POLICY.md": [
                  (
                      "Breaking releases, high/critical changes, the final `1.0.0` compatibility approval, and other commitments identified by `MAINTAINERS.md` still require independent specialist review.",
                      "Breaking changes, high/critical changes, the final `1.0.0` compatibility approval, and other commitments identified by `MAINTAINERS.md` still require independent specialist review."
                  ),
                  (
                      "Breaking releases and the final `1.0.0` compatibility approval require independent specialist review.",
                      "Any breaking change covered by the release and the final `1.0.0` compatibility approval require independent specialist review."
                  ),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"Expected exactly one match in {filename}, found {count}: {old}")
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")

      - name: Commit corrections and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/issue-28-review-followup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MAINTAINERS.md CONTRIBUTING.md RELEASE_POLICY.md .github/workflows/issue-28-review-followup.yml
          git commit -m 'docs(policy): preserve breaking and emergency review gates'
          git push origin HEAD:policy/issue-28-lightweight-maintenance
