name: Issue 29 Generate Dependency Lock

on:
  push:
    branches:
      - ci/issue-29-workflow-hardening
    paths:
      - .github/workflows/issue-29-generate-lock.yml

permissions:
  contents: read

jobs:
  generate-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/validate-schemas/requirements.txt

      - name: Generate hash-locked requirements
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet pip-tools
          python -m piptools compile \
            --generate-hashes \
            --resolver=backtracking \
            --output-file tools/validate-schemas/requirements.lock \
            tools/validate-schemas/requirements.txt
          python -m pip install \
            --disable-pip-version-check \
            --require-hashes \
            -r tools/validate-schemas/requirements.lock

      - name: Upload generated lock
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue-29-python-lock
          path: tools/validate-schemas/requirements.lock
          if-no-files-found: error
          retention-days: 1
