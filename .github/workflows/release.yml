name: Publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/validate-schemas/requirements.lock

      - name: Install validation dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --quiet \
            --require-hashes \
            -r tools/validate-schemas/requirements.lock

      - name: Confirm tagged commit is on main
        shell: bash
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Run complete validation pipeline
        shell: bash
        run: python tools/validate-all/run_all.py --include-tests

      - name: Validate release tag
        shell: bash
        run: |
          python tools/release/validate_release.py \
            --tag "$GITHUB_REF_NAME" \
            --require-head-tag

      - name: Build release artifacts
        shell: bash
        run: |
          python tools/release/build_release.py \
            --tag "$GITHUB_REF_NAME" \
            --output-dir dist \
            --force

      - name: Verify release checksums
        shell: bash
        working-directory: dist
        run: sha256sum -c SHA256SUMS.txt

      - name: Upload validated release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: validate-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download validated release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets-${{ github.ref_name }}
          path: dist

      - name: Re-verify downloaded checksums
        shell: bash
        working-directory: dist
        run: sha256sum -c SHA256SUMS.txt

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          prerelease_args=()
          if [[ "$version" == *-* ]]; then
            prerelease_args+=(--prerelease)
          fi

          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "Public-Access-Agents $version" \
            --notes-file dist/RELEASE_NOTES.md \
            "${prerelease_args[@]}" \
            dist/Public-Access-Agents-*.zip \
            dist/Public-Access-Agents-*.tar.gz \
            dist/SHA256SUMS.txt \
            dist/release-manifest.json \
            dist/RELEASE_NOTES.md \
            dist/MIGRATION_NOTES.md
